    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        :root {
            --rosa-suave: #fff5f8;
            --rosa-borde: #f7c6d8;
            --rosa-acento: #d86c97;
            --rosa-oscuro: #7d3552;
            --texto: #4a353e;
            --blanco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: var(--texto);
            -webkit-user-select: none;
            user-select: none;
            background-color: var(--rosa-suave);
            line-height: 1.65;
            text-align: center;
        }

        img {
            pointer-events: none;
            -webkit-user-drag: none;
        }

        /* BOTÓN FLOTANTE DE MÚSICA */
        .btn-music {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--rosa-acento);
            color: var(--blanco);
            border: 2px solid var(--blanco);
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(125, 53, 82, 0.25);
        }

        /* 1. PORTADA CON NOMBRE Y PRIMERA FOTO VERTICAL */
        .portada {
            max-width: 520px;
            margin: 0 auto;
            padding: 45px 20px 30px;
        }

        .portada .subtitulo {
            letter-spacing: 6px;
            font-size: 0.78rem;
            color: var(--rosa-oscuro);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .portada h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            margin: 0;
            font-weight: 400;
            color: var(--rosa-oscuro);
        }

        .manuscrito {
            font-family: 'Monsieur La Doulaise', cursive;
            font-size: 3.6rem;
            line-height: 1.05;
            color: var(--rosa-acento);
            display: block;
            margin: 4px 0 22px;
        }

        .foto-vertical {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            background: var(--blanco);
            border: 10px solid var(--blanco);
            border-radius: 6px;
            box-shadow: 0 12px 26px rgba(125, 53, 82, 0.14);
        }

        /* SECCIONES */
        .section {
            padding: 55px 22px;
            max-width: 560px;
            margin: 0 auto;
        }

        .section-rosa {
            background-color: rgba(255, 228, 238, 0.75);
            border-top: 1px solid var(--rosa-borde);
            border-bottom: 1px solid var(--rosa-borde);
            max-width: 100%;
        }

        .section-inner {
            max-width: 560px;
            margin: 0 auto;
        }

        .title {
            font-family: 'Playfair Display', serif;
            color: var(--rosa-oscuro);
            font-size: 1.9rem;
            margin-bottom: 24px;
            font-style: italic;
            font-weight: 400;
            position: relative;
            display: inline-block;
        }

        .title::after {
            content: "";
            width: 55%;
            height: 2px;
            background: var(--rosa-borde);
            position: absolute;
            bottom: -6px;
            left: 22.5%;
        }

        /* 2. CARRUSEL DE 10 FOTOS */
        .swiper {
            width: 100%;
            aspect-ratio: 3 / 4;
            border: 10px solid var(--blanco);
            border-radius: 8px;
            box-shadow: 0 12px 26px rgba(125, 53, 82, 0.14);
            overflow: hidden;
            background: var(--blanco);
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .swiper-button-next,
        .swiper-button-prev {
            color: var(--rosa-acento) !important;
            background: rgba(255, 255, 255, 0.82);
            width: 38px;
            height: 38px;
            border-radius: 50%;
        }

        .swiper-button-next::after,
        .swiper-button-prev::after {
            font-size: 1rem;
            font-weight: 700;
        }

        /* 3. MENSAJE DE INVITACIÓN */
        .mensaje-texto {
            font-style: italic;
            color: var(--texto);
            font-size: 1.05rem;
            margin-bottom: 26px;
        }

        /* 4. CONTADOR */
        .fecha-evento {
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: var(--rosa-oscuro);
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .countdown {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .count-box {
            background: var(--blanco);
            border: 1px solid var(--rosa-borde);
            border-bottom: 3px solid var(--rosa-acento);
            border-radius: 6px;
            padding: 12px 10px;
            min-width: 72px;
        }

        .count-box span {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--rosa-oscuro);
        }

        .count-box small {
            letter-spacing: 2px;
            font-size: 0.65rem;
            color: var(--rosa-acento);
            font-weight: 600;
        }

        /* 5. SALMO Y 6. UBICACIÓN */
        .info-box {
            background: var(--blanco);
            padding: 32px 24px;
            border: 1px solid var(--rosa-borde);
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(125, 53, 82, 0.06);
        }

        .salmo-frase {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.25rem;
            color: var(--rosa-oscuro);
            margin-bottom: 12px;
        }

        .salmo-cita {
            letter-spacing: 3px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--rosa-acento);
            text-transform: uppercase;
        }

        .salon-nombre {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            color: var(--rosa-oscuro);
            margin-bottom: 8px;
        }

        .btn-mapa {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 32px;
            background: var(--rosa-acento);
            color: var(--blanco);
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* FOOTER */
        .footer-promo {
            padding: 45px 20px;
            background: var(--blanco);
            border-top: 1px solid var(--rosa-borde);
        }

        .footer-initials {
            font-family: 'Monsieur La Doulaise', cursive;
            font-size: 3.2rem;
            color: var(--rosa-acento);
            display: block;
            line-height: 1;
            margin-bottom: 6px;
        }

        .footer-collection {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: #9c7a88;
            display: block;
            margin-bottom: 8px;
        }

        .footer-link {
            font-size: 0.85rem;
            color: var(--texto);
            text-decoration: none;
        }

        .footer-link b {
            color: var(--rosa-acento);
        }
    </style>
</head>
<body id="global-body" oncontextmenu="return false;">

    <audio id="musica-fondo" loop></audio>
    <button id="btn-musica" class="btn-music" onclick="alternarMusica()">♪ MÚSICA</button>

    <!-- 1. NOMBRE Y PRIMERA FOTO EN VERTICAL -->
    <header class="portada">
        <div class="subtitulo">MIS CINCO AÑOS</div>
        <h1>Mis 5 Años</h1>
        <span class="manuscrito" id="nombre-festejada">Elisama ESTRELLA PACHECO</span>
        <img id="foto-vertical-1" src="" alt="Foto vertical principal de Elisama" class="foto-vertical">
    </header>

    <!-- 2. CARRUSEL DE 10 FOTOS (AUTOMÁTICO Y MANUAL) -->
    <section class="section section-rosa">
        <div class="section-inner">
            <h2 class="title">Mis Momentos</h2>
            <div class="swiper miCarrusel">
                <div class="swiper-wrapper" id="carrusel-slides"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </div>
    </section>

    <!-- 3. MENSAJE DE INVITACIÓN CON SEGUNDA FOTO EN VERTICAL -->
    <section class="section">
        <h2 class="title">Te Invito a Celebrar</h2>
        <p id="mensaje-invitacion" class="mensaje-texto"></p>
        <img id="foto-vertical-2" src="" alt="Segunda foto vertical de Elisama" class="foto-vertical">
    </section>

    <!-- 4. CONTADOR -->
    <section class="section section-rosa">
        <div class="section-inner">
            <h2 class="title">Falta Poco</h2>
            <p id="texto-fecha" class="fecha-evento"></p>
            <div class="countdown">
                <div class="count-box"><span id="d">00</span><small>DÍAS</small></div>
                <div class="count-box"><span id="h">00</span><small>HRS</small></div>
                <div class="count-box"><span id="m">00</span><small>MIN</small></div>
                <div class="count-box"><span id="s">00</span><small>SEG</small></div>
            </div>
        </div>
    </section>

    <!-- 5. FRASE DE UN SALMO -->
    <section class="section">
        <h2 class="title">Con la Bendición de Dios</h2>
        <div class="info-box">
            <p id="frase-salmo" class="salmo-frase"></p>
            <span id="cita-salmo" class="salmo-cita"></span>
        </div>
    </section>

    <!-- 6. UBICACIÓN DEL SALÓN -->
    <section class="section section-rosa">
        <div class="section-inner">
            <h2 class="title">Ubicación del Salón</h2>
            <div class="info-box">
                <div id="nombre-salon" class="salon-nombre"></div>
                <p id="direccion-salon" style="margin: 0;"></p>
                <a id="link-mapa" href="#" target="_blank" rel="noopener noreferrer" class="btn-mapa">Ver Ubicación</a>
            </div>
        </div>
    </section>

    <footer class="footer-promo">
        <span class="footer-initials">E - P</span>
        <span class="footer-collection">MI GRAN DIA COLECCION</span>
        <a id="link-pie" href="https://migrandia.mx" target="_blank" rel="noopener noreferrer" class="footer-link">Creado por <b>migrandia.mx</b></a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        };

        document.title = `Mis 5 Años | ${CONFIG.nombre_festejada}`;
        document.getElementById('og-title').setAttribute('content', `Mis 5 Años | ${CONFIG.nombre_festejada}`);
        document.getElementById('og-image').setAttribute('content', CONFIG.url_preview_compartir);

        if (CONFIG.url_fondo_global) {
            document.getElementById('global-body').style.backgroundImage = `url('${CONFIG.url_fondo_global}')`;
        }

        document.getElementById('nombre-festejada').textContent = CONFIG.nombre_festejada;
        document.getElementById('foto-vertical-1').src = CONFIG.foto_vertical_1;
        document.getElementById('foto-vertical-2').src = CONFIG.foto_vertical_2;
        document.getElementById('mensaje-invitacion').textContent = CONFIG.mensaje_invitacion;
        document.getElementById('texto-fecha').textContent = CONFIG.texto_fecha;
        document.getElementById('frase-salmo').textContent = CONFIG.frase_salmo;
        document.getElementById('cita-salmo').textContent = CONFIG.cita_salmo;
        document.getElementById('nombre-salon').textContent = CONFIG.nombre_salon;
        document.getElementById('direccion-salon').textContent = CONFIG.direccion_salon;
        document.getElementById('link-mapa').href = CONFIG.url_mapa;
        document.getElementById('link-pie').href = CONFIG.url_pagina_principal;

        const audio = document.getElementById('musica-fondo');
        const btnMusica = document.getElementById('btn-musica');
        audio.src = CONFIG.url_musica;

        function actualizarBotonMusica() {
            btnMusica.textContent = audio.paused ? '▶ MÚSICA' : 'II PAUSAR';
        }

        function alternarMusica() {
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
            actualizarBotonMusica();
        }

        document.addEventListener('click', function iniciarAudioEnPrimerToque() {
            if (audio.paused && CONFIG.url_musica) {
                audio.play().then(actualizarBotonMusica).catch(() => {});
            }
            document.removeEventListener('click', iniciarAudioEnPrimerToque);
        }, { once: true });

        const contenedorSlides = document.getElementById('carrusel-slides');
        CONFIG.fotos_carrusel_10.slice(0, 10).forEach((url, i) => {
            const slide = document.createElement('div');
            slide.className = 'swiper-slide';
            slide.innerHTML = `<img src="${url}" alt="Foto ${i + 1} de ${CONFIG.nombre_festejada}">`;
            contenedorSlides.appendChild(slide);
        });

        new Swiper('.miCarrusel', {
            loop: true,
            autoplay: {
                delay: 2800,
                disableOnInteraction: false
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev'
            }
        });

        const target = new Date(CONFIG.fecha_evento).getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const d = Math.max(0, target - now);
            document.getElementById('d').textContent = Math.floor(d / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById('h').textContent = Math.floor((d % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById('m').textContent = Math.floor((d % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById('s').textContent = Math.floor((d % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
